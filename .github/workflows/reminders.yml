# Pings the reminder processor on a schedule.
#
# Render's free tier sleeps after ~15 minutes idle, which stops the in-process
# scheduler, so reminders would fire late. This ping both delivers due
# reminders and keeps the instance awake.
#
# Setup: add a repository secret named CRON_SECRET matching the CRON_SECRET
# environment variable on the server (Settings -> Secrets and variables ->
# Actions -> New repository secret).
name: Process reminders

on:
  schedule:
    # Every 5 minutes -- the shortest GitHub allows -- because the last-call
    # reminder fires 5 minutes before an event and a slower poll would deliver
    # it after the event had already started. GitHub queues scheduled jobs, so
    # the real interval can still drift by a few minutes under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder delivery
        run: |
          # GitHub's scheduler drops runs: observed gaps on this repo were 17
          # to 83 minutes against a requested 5. Render's free tier sleeps
          # after 15 minutes idle, so a single ping per run leaves the service
          # asleep for most of the gap -- reminders arrive late and visitors
          # get Render's 30-second "service waking up" page. Ping repeatedly
          # within the run so one invocation covers a longer window.
          #
          # This is a stopgap. A dedicated uptime monitor hitting the same
          # endpoint every 5 minutes is the dependable fix; see the README.
          fail=0
          for i in $(seq 1 6); do
            code=$(curl -sS -o /tmp/out.json -w "%{http_code}"               --max-time 90 --retry 1 --retry-delay 15               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"               "https://profschedule-ai.onrender.com/api/cron/process-reminders" || echo 000)
            echo "ping $i -> HTTP $code $(head -c 200 /tmp/out.json 2>/dev/null)"
            [ "$code" = "200" ] || fail=$((fail+1))
            [ "$i" -lt 6 ] && sleep 120
          done
          # A cold instance can take ~60s to wake, so tolerate a slow start and
          # only fail the run when every ping failed.
          if [ "$fail" -ge 6 ]; then
            echo "::error::All reminder pings failed"
            exit 1
          fi
          if [ "$fail" -gt 0 ]; then
            echo "::warning::$fail of 6 pings failed"
          fi
