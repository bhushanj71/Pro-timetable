<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ProfSchedule AI</title>
  <style>
    /* This file is the app's local fallback, not the app. Capacitor loads the
       live site; the shell only becomes visible when that cannot be reached,
       so it has to stand on its own with no network at all -- no fonts, no
       images, no scripts from anywhere. */
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background: #FDF9F7;
      color: #2F2A27;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #171311; color: #F2EBE7; }
      .sub { color: #A79C95 !important; }
      .btn { background: #E0785D; }
    }
    .wrap { max-width: 340px; }
    svg { width: 76px; height: 76px; margin-bottom: 20px; }
    h1 { font-size: 1.22rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
    .sub { font-size: 0.92rem; color: #6B6058; margin: 0 0 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 26px;
      border: 0; border-radius: 999px;
      background: #E0785D; color: #fff;
      font: inherit; font-weight: 700;
      cursor: pointer;
    }
    .btn[disabled] { opacity: 0.6; }
    .hint { font-size: 0.78rem; color: #8B8178; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0.08" y1="0" x2="0.85" y2="1">
          <stop offset="0" stop-color="#1FD8F0"/><stop offset="0.58" stop-color="#5A7CF6"/>
          <stop offset="1" stop-color="#B845EE"/>
        </linearGradient>
      </defs>
      <rect x="72" y="96" width="336" height="316" rx="72" fill="url(#g)"/>
      <rect x="118" y="152" width="244" height="212" rx="40" fill="#fff"/>
      <rect x="152" y="196" width="176" height="34" rx="17" fill="#4C8DF6"/>
      <rect x="152" y="256" width="128" height="34" rx="17" fill="#4C8DF6"/>
      <rect x="152" y="40" width="32" height="76" rx="16" fill="#22D3EE"/>
      <rect x="284" y="40" width="32" height="76" rx="16" fill="#22D3EE"/>
    </svg>

    <h1 id="title">No connection</h1>
    <p class="sub" id="sub">
      ProfSchedule AI needs the network to load your timetable. Your data is safe on the
      server — nothing has been lost.
    </p>

    <button class="btn" id="retry">Try again</button>
    <p class="hint" id="hint"></p>
  </div>

  <script>
    // No framework, no imports: this page has to work when nothing loads.
    var SITE = "https://profschedule-ai.onrender.com/dashboard";
    var btn = document.getElementById("retry");
    var hint = document.getElementById("hint");

    function attempt() {
      btn.disabled = true;
      btn.textContent = "Checking…";
      hint.textContent = "";

      // A HEAD to the health endpoint rather than navigating blind: navigating
      // straight to a server that is still down leaves the user on a browser
      // error page with no way back into the app.
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        fail("Still no answer. The server may be waking up — free hosting sleeps after inactivity.");
      }, 8000);

      fetch(SITE.replace("/dashboard", "/api/health"), { method: "GET", cache: "no-store" })
        .then(function (r) {
          if (done) return;
          done = true;
          clearTimeout(timer);
          if (r.ok) { window.location.href = SITE; }
          else { fail("The server answered, but is not healthy yet."); }
        })
        .catch(function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          fail("Still offline. Check your connection and try again.");
        });
    }

    function fail(message) {
      btn.disabled = false;
      btn.textContent = "Try again";
      hint.textContent = message;
    }

    btn.addEventListener("click", attempt);

    // Coming back online is the common case, so it retries itself rather than
    // waiting to be asked.
    window.addEventListener("online", attempt);
  </script>
</body>
</html>
