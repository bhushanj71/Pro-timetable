{% extends "base.html" %}
{% block title %}Login — ProfSchedule AI{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>📅 ProfSchedule AI</h1>
    <div class="subtitle">Sign in to manage your academic schedule.</div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      <div id="login-error" class="form-error"></div>
    </form>
    <div class="auth-switch">Don't have an account? <a href="/register">Create one</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js?v={{ v }}"></script>
{% endblock %}
