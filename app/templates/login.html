{% extends "base.html" %}
{% block title %}Sign In — ProfSchedule AI{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">👑</div>
      <div>
        <div class="brand-name">ProfSchedule <span>AI</span></div>
        <div class="brand-tag">Plan Smarter, Teach Better</div>
      </div>
    </div>
    <h1 style="margin-top:18px">Welcome back</h1>
    <div class="subtitle">Sign in to manage your academic schedule.</div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@college.edu">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <div id="login-error" class="form-error"></div>
    </form>
    <div class="auth-switch">Don't have an account? <a href="/register">Create one</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js?v={{ v }}"></script>
{% endblock %}
