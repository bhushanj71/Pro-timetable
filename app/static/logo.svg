<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ProfSchedule AI">
  <title>ProfSchedule AI</title>

  <defs>
    <!-- Cyan at the top-left through blue to violet at the bottom-right, so
         the mark reads as one light source rather than a flat swatch. -->
    <linearGradient id="psBody" x1="0.08" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#1FD8F0"/>
      <stop offset="0.30" stop-color="#35B6F5"/>
      <stop offset="0.58" stop-color="#5A7CF6"/>
      <stop offset="1"    stop-color="#B845EE"/>
    </linearGradient>

    <!-- The bars sit inside the white panel, so they take the cooler half of
         the same ramp: related, not competing. -->
    <linearGradient id="psBar" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="psSpark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#A855F7"/>
      <stop offset="0.55" stop-color="#C56BF5"/>
      <stop offset="1"   stop-color="#F472D0"/>
    </linearGradient>

    <linearGradient id="psRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- The sparkle overlaps the corner, and the body is cut away around it
         rather than the star simply sitting on top. That gap is what stops
         the two shapes reading as one muddle at 32px. -->
    <mask id="psNotch">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="366" cy="382" r="96" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#psNotch)">
    <!-- Calendar body -->
    <rect x="72" y="96" width="336" height="316" rx="72" fill="url(#psBody)"/>

    <!-- The page. Punched out rather than painted white, so the mark works on
         any background the app happens to have behind it. -->
    <rect x="118" y="152" width="244" height="212" rx="40" fill="#fff"/>

    <!-- Two lines of a day's plan. Unequal, because a real day is. -->
    <rect x="152" y="196" width="176" height="34" rx="17" fill="url(#psBar)"/>
    <rect x="152" y="256" width="128" height="34" rx="17" fill="url(#psBar)"/>
  </g>

  <!-- Binding rings. The dark loop behind each post is what makes them read
       as rings threaded through the cover rather than two stubs on top. -->
  <g fill="none" stroke="#0B1B3F" stroke-width="26">
    <circle cx="168" cy="104" r="30"/>
    <circle cx="300" cy="104" r="30"/>
  </g>
  <rect x="152" y="40" width="32" height="76" rx="16" fill="url(#psRing)"/>
  <rect x="284" y="40" width="32" height="76" rx="16" fill="url(#psRing)"/>

  <!-- Four-point sparkle: the "AI" of the name, said without a word. Concave
       sides rather than straight ones, so it glints instead of pointing. -->
  <path fill="url(#psSpark)"
        d="M366 286
           Q380 358 452 372
           Q380 386 366 458
           Q352 386 280 372
           Q352 358 366 286 Z"/>
</svg>
